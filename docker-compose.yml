services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grader}
      POSTGRES_DB: ${POSTGRES_DB:-grader}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-grader} -d $${POSTGRES_DB:-grader}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://grader:grader@postgres:5432/grader}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: ${STORAGE_DIR}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-}
      AI_VISION_API_KEY: ${AI_VISION_API_KEY:-}
      AI_GRADING_BASE_URL: ${AI_GRADING_BASE_URL:-}
      AI_GRADING_API_KEY: ${AI_GRADING_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL}
      AI_GRADING_MODEL: ${AI_GRADING_MODEL}
      AI_VISION_CHAIN: ${AI_VISION_CHAIN:-}
      AI_VISION_RUBRIC_CHAIN: ${AI_VISION_RUBRIC_CHAIN:-}
      AI_VISION_STUDENT_EXTRACTION_CHAIN: ${AI_VISION_STUDENT_EXTRACTION_CHAIN:-}
      AI_VISION_SPLIT_HEADER_CHAIN: ${AI_VISION_SPLIT_HEADER_CHAIN:-}
      AI_VISION_GRADING_REVIEW_CHAIN: ${AI_VISION_GRADING_REVIEW_CHAIN:-}
      AI_VISION_ROSTER_CHAIN: ${AI_VISION_ROSTER_CHAIN:-}
      AI_GRADING_CHAIN: ${AI_GRADING_CHAIN:-}
      AI_GRADING_REVIEW_ENABLED: ${AI_GRADING_REVIEW_ENABLED:-false}
      AI_GRADING_REVIEW_MODEL: ${AI_GRADING_REVIEW_MODEL:-}
      AI_GRADING_REVIEW_CHAIN: ${AI_GRADING_REVIEW_CHAIN:-}
      AI_GRADING_REVIEW_SCORE_DELTA_RATIO: ${AI_GRADING_REVIEW_SCORE_DELTA_RATIO:-0.15}
      AI_GRADING_REVIEW_VARIANCE_MIN_ANSWERS: ${AI_GRADING_REVIEW_VARIANCE_MIN_ANSWERS:-3}
      AI_GRADING_REVIEW_VARIANCE_RANGE_RATIO: ${AI_GRADING_REVIEW_VARIANCE_RANGE_RATIO:-0.45}
      AI_GRADING_CONCURRENCY: ${AI_GRADING_CONCURRENCY:-4}
      AI_GRADING_GLOBAL_CONCURRENCY: ${AI_GRADING_GLOBAL_CONCURRENCY:-4}
      AI_GRADING_STRICTNESS: ${AI_GRADING_STRICTNESS:-moderate}
      OCR_PREPROCESS_ENABLED: ${OCR_PREPROCESS_ENABLED:-false}
      OCR_PREPROCESS_RUBRIC_ENABLED: ${OCR_PREPROCESS_RUBRIC_ENABLED:-false}
      OCR_PREPROCESS_STUDENT_ENABLED: ${OCR_PREPROCESS_STUDENT_ENABLED:-true}
      OCR_PREPROCESS_SPLIT_HEADER_ENABLED: ${OCR_PREPROCESS_SPLIT_HEADER_ENABLED:-true}
      PADDLE_OCR_BASE_URL: ${PADDLE_OCR_BASE_URL:-https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
      PADDLE_OCR_API_KEY: ${PADDLE_OCR_API_KEY:-}
      PADDLE_OCR_MODEL: ${PADDLE_OCR_MODEL:-PaddleOCR-VL-1.5}
      PADDLE_OCR_TIMEOUT_SECONDS: ${PADDLE_OCR_TIMEOUT_SECONDS:-120}
      PADDLE_OCR_POLL_INTERVAL_SECONDS: ${PADDLE_OCR_POLL_INTERVAL_SECONDS:-5}
      PADDLE_OCR_MAX_POLL_SECONDS: ${PADDLE_OCR_MAX_POLL_SECONDS:-120}
      OCR_MIN_TEXT_CHARS_FOR_REFERENCE: ${OCR_MIN_TEXT_CHARS_FOR_REFERENCE:-80}
      OCR_SPLIT_HEADER_MIN_CONFIDENCE: ${OCR_SPLIT_HEADER_MIN_CONFIDENCE:-0.75}
      OCR_SPLIT_HEADER_CONCURRENCY: ${OCR_SPLIT_HEADER_CONCURRENCY:-4}
      OCR_PREPROCESS_ROSTER_ENABLED: ${OCR_PREPROCESS_ROSTER_ENABLED:-false}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_API_TOKEN_REQUIRED: ${ADMIN_API_TOKEN_REQUIRED:-false}
      EXPORT_GLOBAL_CONCURRENCY: ${EXPORT_GLOBAL_CONCURRENCY:-2}
      EXPORT_SUBMISSIONS_ZIP_MAX_SUBMISSIONS: ${EXPORT_SUBMISSIONS_ZIP_MAX_SUBMISSIONS:-200}
      SUBMISSIONS_UPLOAD_MAX_FILES: ${SUBMISSIONS_UPLOAD_MAX_FILES:-20}
      BATCH_ZIP_MAX_ENTRIES: ${BATCH_ZIP_MAX_ENTRIES:-300}
      BATCH_ZIP_MAX_UNCOMPRESSED_BYTES: ${BATCH_ZIP_MAX_UNCOMPRESSED_BYTES:-2147483648}
      AI_GRADING_BATCH_SIZE: ${AI_GRADING_BATCH_SIZE:-5}
      GRADING_STALE_SUBMISSION_SECONDS: ${GRADING_STALE_SUBMISSION_SECONDS:-1200}
      GRADING_STALE_BATCH_REVIEW_SECONDS: ${GRADING_STALE_BATCH_REVIEW_SECONDS:-3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      RENDER_DPI: ${RENDER_DPI:-200}
      CORS_ORIGINS: ${CORS_ORIGINS}
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      - ./prompts:/workspace/prompts
      - ./storage:/workspace/storage
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://grader:grader@postgres:5432/grader}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: ${STORAGE_DIR}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-}
      AI_VISION_API_KEY: ${AI_VISION_API_KEY:-}
      AI_GRADING_BASE_URL: ${AI_GRADING_BASE_URL:-}
      AI_GRADING_API_KEY: ${AI_GRADING_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL}
      AI_GRADING_MODEL: ${AI_GRADING_MODEL}
      AI_VISION_CHAIN: ${AI_VISION_CHAIN:-}
      AI_VISION_RUBRIC_CHAIN: ${AI_VISION_RUBRIC_CHAIN:-}
      AI_VISION_STUDENT_EXTRACTION_CHAIN: ${AI_VISION_STUDENT_EXTRACTION_CHAIN:-}
      AI_VISION_SPLIT_HEADER_CHAIN: ${AI_VISION_SPLIT_HEADER_CHAIN:-}
      AI_VISION_GRADING_REVIEW_CHAIN: ${AI_VISION_GRADING_REVIEW_CHAIN:-}
      AI_VISION_ROSTER_CHAIN: ${AI_VISION_ROSTER_CHAIN:-}
      AI_GRADING_CHAIN: ${AI_GRADING_CHAIN:-}
      AI_GRADING_REVIEW_ENABLED: ${AI_GRADING_REVIEW_ENABLED:-false}
      AI_GRADING_REVIEW_MODEL: ${AI_GRADING_REVIEW_MODEL:-}
      AI_GRADING_REVIEW_CHAIN: ${AI_GRADING_REVIEW_CHAIN:-}
      AI_GRADING_REVIEW_SCORE_DELTA_RATIO: ${AI_GRADING_REVIEW_SCORE_DELTA_RATIO:-0.15}
      AI_GRADING_REVIEW_VARIANCE_MIN_ANSWERS: ${AI_GRADING_REVIEW_VARIANCE_MIN_ANSWERS:-3}
      AI_GRADING_REVIEW_VARIANCE_RANGE_RATIO: ${AI_GRADING_REVIEW_VARIANCE_RANGE_RATIO:-0.45}
      AI_GRADING_CONCURRENCY: ${AI_GRADING_CONCURRENCY:-4}
      AI_GRADING_GLOBAL_CONCURRENCY: ${AI_GRADING_GLOBAL_CONCURRENCY:-4}
      AI_GRADING_STRICTNESS: ${AI_GRADING_STRICTNESS:-moderate}
      OCR_PREPROCESS_ENABLED: ${OCR_PREPROCESS_ENABLED:-false}
      OCR_PREPROCESS_RUBRIC_ENABLED: ${OCR_PREPROCESS_RUBRIC_ENABLED:-false}
      OCR_PREPROCESS_STUDENT_ENABLED: ${OCR_PREPROCESS_STUDENT_ENABLED:-true}
      OCR_PREPROCESS_SPLIT_HEADER_ENABLED: ${OCR_PREPROCESS_SPLIT_HEADER_ENABLED:-true}
      PADDLE_OCR_BASE_URL: ${PADDLE_OCR_BASE_URL:-https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
      PADDLE_OCR_API_KEY: ${PADDLE_OCR_API_KEY:-}
      PADDLE_OCR_MODEL: ${PADDLE_OCR_MODEL:-PaddleOCR-VL-1.5}
      PADDLE_OCR_TIMEOUT_SECONDS: ${PADDLE_OCR_TIMEOUT_SECONDS:-120}
      PADDLE_OCR_POLL_INTERVAL_SECONDS: ${PADDLE_OCR_POLL_INTERVAL_SECONDS:-5}
      PADDLE_OCR_MAX_POLL_SECONDS: ${PADDLE_OCR_MAX_POLL_SECONDS:-120}
      OCR_MIN_TEXT_CHARS_FOR_REFERENCE: ${OCR_MIN_TEXT_CHARS_FOR_REFERENCE:-80}
      OCR_SPLIT_HEADER_MIN_CONFIDENCE: ${OCR_SPLIT_HEADER_MIN_CONFIDENCE:-0.75}
      OCR_SPLIT_HEADER_CONCURRENCY: ${OCR_SPLIT_HEADER_CONCURRENCY:-4}
      OCR_PREPROCESS_ROSTER_ENABLED: ${OCR_PREPROCESS_ROSTER_ENABLED:-false}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_API_TOKEN_REQUIRED: ${ADMIN_API_TOKEN_REQUIRED:-false}
      EXPORT_GLOBAL_CONCURRENCY: ${EXPORT_GLOBAL_CONCURRENCY:-2}
      EXPORT_SUBMISSIONS_ZIP_MAX_SUBMISSIONS: ${EXPORT_SUBMISSIONS_ZIP_MAX_SUBMISSIONS:-200}
      SUBMISSIONS_UPLOAD_MAX_FILES: ${SUBMISSIONS_UPLOAD_MAX_FILES:-20}
      BATCH_ZIP_MAX_ENTRIES: ${BATCH_ZIP_MAX_ENTRIES:-300}
      BATCH_ZIP_MAX_UNCOMPRESSED_BYTES: ${BATCH_ZIP_MAX_UNCOMPRESSED_BYTES:-2147483648}
      AI_GRADING_BATCH_SIZE: ${AI_GRADING_BATCH_SIZE:-5}
      GRADING_STALE_SUBMISSION_SECONDS: ${GRADING_STALE_SUBMISSION_SECONDS:-1200}
      GRADING_STALE_BATCH_REVIEW_SECONDS: ${GRADING_STALE_BATCH_REVIEW_SECONDS:-3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      RENDER_DPI: ${RENDER_DPI:-200}
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
      - ./prompts:/workspace/prompts
      - ./storage:/workspace/storage
    command: celery -A app.workers.celery_app.celery_app worker -l info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    command: sh -c "[ -d node_modules ] || npm install; npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  frontend_node_modules:
